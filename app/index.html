<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask My Notes</title>
  <style>
    :root {
      --bg: #faf9f5;
      --sidebar: #f0eee6;
      --surface: #ffffff;
      --border: #e3dfd3;
      --text: #29261b;
      --muted: #73705f;
      --accent: #c96442;
      --accent-hover: #b5573a;
      --hover: #e8e5da;
      --user-bubble: #f0eee6;
      --code-bg: #f3f1ea;
      --danger: #b3261e;
      --ok: #3c8d4f;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #262624;
        --sidebar: #1f1e1d;
        --surface: #30302e;
        --border: #3e3d39;
        --text: #ecebe4;
        --muted: #a3a194;
        --hover: #2c2b29;
        --user-bubble: #141413;
        --code-bg: #1a1a18;
        --danger: #f2877c;
        --ok: #6cc07f;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
    button { font: inherit; color: inherit; cursor: pointer; }

    .app { display: flex; height: 100dvh; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 272px; flex-shrink: 0; background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 14px 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
    .brand-logo {
      width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff;
      display: grid; place-items: center;
    }
    .brand-name { font-family: var(--serif); font-size: 19px; font-weight: 600; }
    .new-chat {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border: 0; border-radius: 10px; background: none;
      color: var(--accent); font-weight: 600; text-align: left;
    }
    .new-chat:hover { background: var(--hover); }
    .new-chat .plus {
      width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
      display: grid; place-items: center; font-size: 18px; line-height: 1;
    }
    .recents-label { font-size: 12px; color: var(--muted); padding: 18px 10px 6px; }
    .recents { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    .recents li { display: flex; align-items: center; border-radius: 8px; }
    .recents li:hover, .recents li.active { background: var(--hover); }
    .recents .open {
      flex: 1; min-width: 0; padding: 8px 10px; border: 0; background: none; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px;
    }
    .recents .del {
      border: 0; background: none; color: var(--muted); padding: 4px 10px; font-size: 16px;
      visibility: hidden;
    }
    .recents li:hover .del { visibility: visible; }
    .recents .del:hover { color: var(--danger); }
    .recents-empty { color: var(--muted); font-size: 13px; padding: 4px 10px; }
    .status {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
      padding: 12px 10px 2px; border-top: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--danger); }

    /* ---------- Main ---------- */
    main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header {
      height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    }
    .chat-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-btn { display: none; border: 0; background: none; padding: 6px; border-radius: 8px; }
    .menu-btn:hover { background: var(--hover); }

    .scroll { flex: 1; overflow-y: auto; }
    .thread { max-width: 740px; margin: 0 auto; padding: 8px 16px 24px; }

    .msg { margin: 18px 0; }
    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble {
      background: var(--user-bubble); padding: 10px 16px; border-radius: 18px;
      max-width: 85%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5;
    }
    .msg.assistant { display: flex; gap: 14px; }
    .avatar {
      width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; margin-top: 2px;
      background: var(--accent); color: #fff; display: grid; place-items: center;
    }
    .body { flex: 1; min-width: 0; }
    .md { font-family: var(--serif); font-size: 16.5px; line-height: 1.65; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 12px; }
    .md ul, .md ol { margin: 0 0 12px; padding-left: 24px; }
    .md li { margin: 4px 0; }
    .md h3, .md h4 { font-family: var(--sans); margin: 18px 0 8px; }
    .md code {
      font-family: var(--mono); font-size: 0.85em; background: var(--code-bg);
      border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
    }
    .md.error { color: var(--danger); font-family: var(--sans); font-size: 15px; }
    .code {
      margin: 0 0 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--code-bg); overflow: hidden;
    }
    .code-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; font-family: var(--sans); font-size: 12px; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .code pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
    .code pre code { border: 0; background: none; padding: 0; font-size: 13.5px; line-height: 1.5; }
    .code-copy, .copy {
      border: 0; background: none; color: var(--muted); font-size: 12px;
      padding: 3px 8px; border-radius: 6px;
    }
    .code-copy:hover, .copy:hover { background: var(--hover); color: var(--text); }
    .actions { margin-top: 6px; opacity: 0; transition: opacity .15s; }
    .msg.assistant:hover .actions, .msg.assistant:last-child .actions { opacity: 1; }

    .typing { display: flex; gap: 5px; padding: 10px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

    /* ---------- Composer ---------- */
    .composer-wrap { width: 100%; max-width: 740px; margin: 0 auto; padding: 0 16px 16px; }
    .composer {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 12px 12px 10px 16px; box-shadow: 0 2px 12px rgba(0, 0, 0, .05);
    }
    .composer:focus-within { border-color: var(--muted); }
    .composer textarea {
      width: 100%; border: 0; outline: 0; resize: none; background: none; color: var(--text);
      font: inherit; font-size: 16px; line-height: 1.5; max-height: 220px; padding: 2px 0;
    }
    .composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .hint { font-size: 12px; color: var(--muted); }
    .send {
      width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
      display: grid; place-items: center;
    }
    .send:hover { background: var(--accent-hover); }
    .send:disabled { opacity: .4; cursor: default; background: var(--accent); }
    .suggestions { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .suggestions button {
      border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
      padding: 7px 12px; font-size: 13.5px; color: var(--muted);
    }
    .suggestions button:hover { color: var(--text); border-color: var(--muted); }
    .footnote { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* Empty state: greeting and composer centered on screen */
    .welcome { text-align: center; padding-top: 12px; }
    .welcome h1 {
      font-family: var(--serif); font-weight: 400; font-size: 38px; margin: 0 0 8px;
      display: flex; align-items: center; justify-content: center; gap: 14px;
    }
    .welcome h1 .avatar { width: 36px; height: 36px; margin: 0; }
    .welcome p { color: var(--muted); margin: 0 0 24px; }
    main.empty .scroll { flex: 0 0 auto; margin-top: auto; overflow: visible; }
    main.empty .composer-wrap { margin-bottom: auto; }
    main.empty .suggestions { display: flex; }
    main.empty .footnote { display: none; }

    /* ---------- Mobile ---------- */
    .overlay { display: none; }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%);
        transition: transform .2s;
      }
      .app.nav-open .sidebar { transform: none; box-shadow: 4px 0 20px rgba(0, 0, 0, .15); }
      .app.nav-open .overlay { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .3); }
      .menu-btn { display: block; }
      .welcome h1 { font-size: 28px; }
      .actions { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span class="brand-name">Ask My Notes</span>
      </div>
      <button class="new-chat" id="newChat" type="button"><span class="plus">+</span>New chat</button>
      <div class="recents-label">Recents</div>
      <ul class="recents" id="recents"></ul>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main id="main">
      <header>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="chat-title" id="chatTitle"></div>
      </header>

      <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask anything about your notes…"></textarea>
          <div class="composer-row">
            <span class="hint">Enter to send · Shift+Enter for a new line</span>
            <button class="send" id="send" type="submit" aria-label="Send" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </form>
        <div class="suggestions" id="suggestions"></div>
        <div class="footnote">Answers come only from your notes. Check important commands before running them.</div>
      </div>
    </main>
  </div>

  <script>
    const STORE_KEY = "ask-my-notes-chats";
    const SUGGESTIONS = [
      "How do I check which process uses a port?",
      "How do I disable SSH password login?",
      "What should I avoid to keep AWS at $0?",
      "Summarize my notes",
    ];
    const LOGO = document.querySelector(".brand-logo").innerHTML;

    const $ = (id) => document.getElementById(id);
    const app = $("app"), main = $("main"), thread = $("thread"), scroll = $("scroll");
    const input = $("input"), sendBtn = $("send");

    let chats = loadChats();
    let currentId = null;
    let pendingId = null; // chat that is waiting for an answer

    // ---------- Storage (browser only; survives reloads) ----------
    function loadChats() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; }
    }
    function saveChats() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(chats)); } catch { /* storage unavailable */ }
    }
    const currentChat = () => chats.find((c) => c.id === currentId);

    // ---------- Tiny, safe markdown renderer ----------
    function esc(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function inline(s) {
      return s.split(/(`[^`]+`)/).map((part) =>
        /^`[^`]+`$/.test(part)
          ? `<code>${esc(part.slice(1, -1))}</code>`
          : esc(part).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      ).join("");
    }
    function blocks(text) {
      let out = "", para = [], list = null;
      const flushPara = () => {
        if (para.length) out += `<p>${para.map(inline).join("<br>")}</p>`;
        para = [];
      };
      const flushList = () => {
        if (list) out += `<${list.type}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.type}>`;
        list = null;
      };
      const addItem = (type, item) => {
        flushPara();
        if (!list || list.type !== type) { flushList(); list = { type, items: [] }; }
        list.items.push(item);
      };
      for (const line of text.split("\n")) {
        let m;
        if (!line.trim()) { flushPara(); flushList(); }
        else if ((m = line.match(/^(#{1,6})\s+(.*)/))) {
          flushPara(); flushList();
          const tag = m[1].length <= 2 ? "h3" : "h4";
          out += `<${tag}>${inline(m[2])}</${tag}>`;
        }
        else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) addItem("ul", m[1]);
        else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) addItem("ol", m[1]);
        else if (list && /^\s{2,}/.test(line)) list.items[list.items.length - 1] += " " + line.trim();
        else { flushList(); para.push(line); }
      }
      flushPara(); flushList();
      return out;
    }
    function renderMarkdown(src) {
      return src.split("```").map((part, i) => {
        if (i % 2 === 0) return blocks(part);
        let lang = "", code = part;
        const nl = part.indexOf("\n");
        if (nl >= 0 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim())) {
          lang = part.slice(0, nl).trim();
          code = part.slice(nl + 1);
        }
        return `<div class="code"><div class="code-head"><span>${esc(lang || "code")}</span>` +
          `<button class="code-copy" type="button">Copy</button></div>` +
          `<pre><code>${esc(code.replace(/\n+$/, ""))}</code></pre></div>`;
      }).join("");
    }

    // ---------- Rendering ----------
    function greeting() {
      const h = new Date().getHours();
      return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    }

    function renderSidebar() {
      const list = $("recents");
      if (!chats.length) {
        list.innerHTML = `<li class="recents-empty">No chats yet</li>`;
        return;
      }
      list.innerHTML = [...chats]
        .sort((a, b) => b.updated - a.updated)
        .map((c) => `<li class="${c.id === currentId ? "active" : ""}" data-id="${c.id}">
            <button class="open" type="button" title="${esc(c.title)}">${esc(c.title)}</button>
            <button class="del" type="button" aria-label="Delete chat">×</button>
          </li>`).join("");
    }

    function renderThread() {
      const chat = currentChat();
      main.classList.toggle("empty", !chat);
      $("chatTitle").textContent = chat ? chat.title : "";

      if (!chat) {
        thread.innerHTML = `<div class="welcome">
            <h1><span class="avatar">${LOGO}</span>${greeting()}</h1>
            <p>What would you like to look up in your notes?</p>
          </div>`;
        return;
      }

      thread.innerHTML = chat.messages.map((m, i) => m.role === "user"
        ? `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`
        : `<div class="msg assistant"><div class="avatar">${LOGO}</div><div class="body">
             <div class="md${m.error ? " error" : ""}">${m.error ? esc(m.text) : renderMarkdown(m.text)}</div>
             ${m.error ? "" : `<div class="actions"><button class="copy" type="button" data-i="${i}">Copy</button></div>`}
           </div></div>`
      ).join("");

      if (pendingId === chat.id) {
        thread.insertAdjacentHTML("beforeend",
          `<div class="msg assistant"><div class="avatar">${LOGO}</div>
             <div class="typing"><span></span><span></span><span></span></div></div>`);
      }
      scroll.scrollTop = scroll.scrollHeight;
    }

    function render() {
      renderSidebar();
      renderThread();
      updateSendButton();
    }

    function updateSendButton() {
      sendBtn.disabled = !input.value.trim() || pendingId !== null;
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 220) + "px";
    }

    // ---------- Sending ----------
    async function send(text) {
      text = text.trim();
      if (!text || pendingId) return;

      let chat = currentChat();
      if (!chat) {
        chat = { id: Date.now().toString(36), title: text.slice(0, 60), messages: [], updated: Date.now() };
        chats.push(chat);
        currentId = chat.id;
      }
      chat.messages.push({ role: "user", text });
      chat.updated = Date.now();
      pendingId = chat.id;
      input.value = "";
      autosize();
      saveChats();
      render();

      let reply;
      try {
        const r = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text }),
        });
        const data = await r.json().catch(() => ({}));
        reply = r.ok
          ? { role: "assistant", text: data.answer || "(empty answer)" }
          : { role: "assistant", error: true, text: data.detail || `Request failed (HTTP ${r.status}).` };
      } catch {
        reply = { role: "assistant", error: true, text: "Couldn't reach the server. Is the app running?" };
      }

      chat.messages.push(reply);
      chat.updated = Date.now();
      pendingId = null;
      saveChats();
      render();
      input.focus();
    }

    // ---------- Events ----------
    $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
    });
    input.addEventListener("input", () => { autosize(); updateSendButton(); });

    $("newChat").addEventListener("click", () => {
      currentId = null;
      app.classList.remove("nav-open");
      render();
      input.focus();
    });

    $("recents").addEventListener("click", (e) => {
      const li = e.target.closest("li[data-id]");
      if (!li) return;
      if (e.target.closest(".del")) {
        chats = chats.filter((c) => c.id !== li.dataset.id);
        if (currentId === li.dataset.id) currentId = null;
        saveChats();
      } else {
        currentId = li.dataset.id;
        app.classList.remove("nav-open");
      }
      render();
    });

    thread.addEventListener("click", async (e) => {
      const btn = e.target.closest(".copy, .code-copy");
      if (!btn) return;
      const text = btn.classList.contains("copy")
        ? currentChat().messages[btn.dataset.i].text
        : btn.closest(".code").querySelector("code").textContent;
      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = "Copied";
      } catch {
        btn.textContent = "Copy failed";
      }
      setTimeout(() => (btn.textContent = "Copy"), 1500);
    });

    $("suggestions").innerHTML = SUGGESTIONS.map((s) => `<button type="button">${esc(s)}</button>`).join("");
    $("suggestions").addEventListener("click", (e) => {
      if (e.target.matches("button")) send(e.target.textContent);
    });

    $("menuBtn").addEventListener("click", () => app.classList.add("nav-open"));
    $("overlay").addEventListener("click", () => app.classList.remove("nav-open"));

    // ---------- Backend status ----------
    fetch("/health")
      .then((r) => r.json())
      .then((h) => {
        $("statusDot").className = "dot ok";
        $("statusText").textContent = `${h.notes} note${h.notes === 1 ? "" : "s"} · ${h.provider}`;
      })
      .catch(() => {
        $("statusDot").className = "dot bad";
        $("statusText").textContent = "Server offline";
      });

    render();
    input.focus();
  </script>
</body>
</html>
