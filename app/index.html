<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask My Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 80px; font: inherit; }
    button { margin-top: 8px; padding: 8px 16px; font: inherit; }
    #answer { white-space: pre-wrap; margin-top: 16px; padding: 12px; background: #f4f4f4; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Ask My Notes</h1>
  <textarea id="q" placeholder="How do I see which process is using port 8080?"></textarea>
  <button id="go">Ask</button>
  <div id="answer"></div>
  <script>
    document.getElementById("go").onclick = async () => {
      const out = document.getElementById("answer");
      out.textContent = "Thinking...";
      const r = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: document.getElementById("q").value }),
      });
      const data = await r.json();
      out.textContent = r.ok ? data.answer : "Error: " + data.detail;
    };
  </script>
</body>
</html>
